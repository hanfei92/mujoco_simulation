syntax = "proto3";

package aidea.image;

message Header {
  int64 stamp_sec = 1;
  int64 stamp_nsec = 2;
  string frame_id = 3;
}

// Aligned with sensor_msgs/Image, plus intrinsics and the camera pose so the
// ROS bridge can publish Image, CameraInfo and TF from one message.
message Image {
  Header header = 1;
  uint32 height = 2;
  uint32 width = 3;
  string encoding = 4;       // "rgb8" / "bgr8" / "mono8" / "32FC1"
  uint32 step = 5;
  bool is_bigendian = 6;
  bytes data = 7;

  // Pinhole intrinsics (pixels)
  double fx = 8;
  double fy = 9;
  double cx = 10;
  double cy = 11;

  // Camera pose in the world frame (optical convention: x right, y down, z forward)
  double cam_x = 12;
  double cam_y = 13;
  double cam_z = 14;
  double cam_qx = 15;
  double cam_qy = 16;
  double cam_qz = 17;
  double cam_qw = 18;
}
