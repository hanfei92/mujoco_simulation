[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aidea_mujoco"
version = "0.1.0"
description = "Aidea MuJoCo simulation"
requires-python = ">=3.10"
dependencies = [
    "click",
    "mujoco",
    "mujoco-lidar[warp]",
    "numpy",
    "scipy",
    "opencv-python",
    "pynput",
    "yourdfpy",
    "grpcio-tools>=1.85.1",
    "pyzmq>=27.3.0",
    "protobuf>=7.36.2",
]

[tool.setuptools.packages.find]
where = ["aidea_mujoco"]
include = ["aidea_mujoco*"]
